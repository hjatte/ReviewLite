name: ReviewLite
options:
  bundleIdPrefix: com.reviewlite
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Two configs: Debug for local development (ad-hoc signed), Release for distribution
# (hardened, optimised, ready to be signed with a real Developer ID).
# When you obtain an Apple Developer ID Application certificate, change
# `CODE_SIGN_IDENTITY` under `Release` below to "Developer ID Application:
# Your Name (TEAMID)" — that's the only line that needs to change for distribution.
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Resources/ReviewLite.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.reviewlite.app
    DEAD_CODE_STRIPPING: YES
    ENABLE_DEBUG_DYLIB: NO
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_OPTIMIZATION_LEVEL: 0
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application: Harry Attenborough (V6S3PJU7G4)"
      DEVELOPMENT_TEAM: V6S3PJU7G4
      CODE_SIGN_STYLE: Manual
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.0.0

targets:
  ReviewLite:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_NAME: ReviewLite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
